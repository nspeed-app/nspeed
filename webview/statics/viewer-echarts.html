<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>NSpeed Results</title>
    <style>
        .flex-container {
            display: flex;
            flex-flow: column;
            flex-direction: column;
            background-color: var(--bkg-color);
            height: 100%;
            padding: 15px;
            gap: 5px;

        }
        .flex-container>div {
            background: var(--bkg-color);
            border: 3px solid #ffcc80;
            border-radius: 5px;
            padding: 8px;
            flex-grow: 1;
        }
        .flex-charts {
            display: flex;
            flex-direction: row;
            flex-flow: row wrap;
            flex-wrap: warp;
            /* flex-grow: 1; */
            height: 75vh;
        }
        .flex-charts>div {
            flex-grow: 1;
        }
    </style>
    <script src="echarts.min.js"></script>
    <script src="nspeed-echarts.js"></script>
    <script removeimports="true" src="gen-echarts.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="flex-container" style="flex-direction:row">
        <div id="dlgJSON" style="display:none; border: none;">
            <input type="file" id="file" style="display:none;" />
            <button type="button">
                <label for="file">open</label>
            </button>
        </div>
        <div style="display:inline;flex: 1 1 auto; text-align: center; border: none"> NSpeed 1.0.0</div>
        <label class="switch">
            <input type="checkbox" id="theme-switcher">
            <span class="slider round"></span>
        </label>
    </div>
    <div class="flex-container">
        <div class="flex-charts" id="#charts">
        </div>
        <div onclick="toggleCommand()">
            <hr style="height:2px;border:none;color:#333;background-color:#333;" />
            <pre id="#Command">	not loaded </pre>
            <hr style="height:2px;border:none;color:#333;background-color:#333;" />
        </div>
    </div>
    <script>
        function toggleCommand() {
            var x = document.getElementById("#Command");
            if (x.style.display === "none") {
                x.style.display = "block";
            } else {
                x.style.display = "none";
            }
        }
        // globals
        let datajson = `{{.}}`; // Go template will fill this
        let data = null;
        let ActiveCharts = [];
        let darkmode = false;
        //
        function makeCharts() {
            let charts = /**@type {HTMLCanvasElement}*/document.getElementById("#charts")
            if (ActiveCharts != []) {
                ActiveCharts.map(c => c.dispose());
                ActiveCharts = [];
                charts.innerHTML = '';
            }
            ActiveCharts = genCharts(charts, darkmode ? "dark" : "", data);
        }

        // load json from data, update jsonreport
        function loadJSON(data, cmd) {
            try {
                data = JSON.parse(data); // Go template will replace this with actual json
            }
            catch (error) {
                cmd.textContent = error.name + ":" + error.message;
                return null
            }
            // for here, jsonreport is valid
            cmd.textContent = data.command;
        }

        let Command = document.getElementById('#Command');
        // load a json from an input.onchange event
        loadJSONFiles = function (event) {
            let files = event.target.files;
            var reader = new FileReader();
            reader.onload = function (e) {
                loadJSON(e.target.result, Command);
                makeCharts();

            };
            reader.readAsText(files[0]);
        }
        window.onload = function () {
            var dlgJSON = document.getElementById('dlgJSON');
            if (datajson.length > 5) {
                loadJSON(datajson, Command);
                makeCharts();
            }
            if (data == null) {
                dlgJSON.style.display = "block";
                let input = document.getElementById('file');
                input.onchange = loadJSONFiles;
            }
        }

        // dark/light mode stuff
        document.addEventListener('DOMContentLoaded', function () {
            const themeSwitcher = document.getElementById('theme-switcher');

            // Load saved theme preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
                themeSwitcher.checked = true;
            }

            // Detect OS preference if no saved preference
            else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                document.body.classList.add('dark');
                themeSwitcher.checked = true;
            }
            darkmode = themeSwitcher.checked;

            // Handle toggle switch
            themeSwitcher.addEventListener('change', function () {
                document.body.classList.toggle('dark');
                localStorage.setItem('theme', this.checked ? 'dark' : 'light');
                darkmode = themeSwitcher.checked;
                makeCharts();
            });
        });
        // resize
        window.onresize = function() {
              ActiveCharts.map( c=>c.resize());
        };

    </script>
</body>

</html>
