name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the GitHub release and upload assets

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs the full history and tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # the repo carries two tag series (v0.0.x from the old nspeed-client repo, v0.x.0 here):
      # pick the previous tag by semver order, not by git distance, so the changelog range is right.
      - name: previous tag
        run: |
          prev=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -A1 -x "${GITHUB_REF_NAME}" | sed -n 2p)
          echo "previous tag: ${prev:-<none>}"
          [ -n "$prev" ] && echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV" || true

      # release notes = the CHANGELOG.md section for this tag, else goreleaser's generated changelog
      - name: release notes
        run: |
          if .github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"; then
            echo "using CHANGELOG.md section"
            echo "GORELEASER_ARGS=--release-notes=${RUNNER_TEMP}/notes.md" >> "$GITHUB_ENV"
          else
            echo "::warning::no '# ${GITHUB_REF_NAME}' section in CHANGELOG.md, using generated changelog"
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ env.GORELEASER_ARGS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional: enables the Homebrew tap update (see homebrew_casks in .goreleaser.yml)
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
