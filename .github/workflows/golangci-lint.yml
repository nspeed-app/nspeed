name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # app.wasm is git-ignored but required by //go:embed in nspeed/ui.go
      - name: build wasm UI
        run: GOOS=js GOARCH=wasm go build -o nspeed/embed/ui/app.wasm ./nspeed/ui/goapp/main
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
