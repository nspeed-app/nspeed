# GoReleaser config, used by .github/workflows/release.yml on `v*` tags.
# Local dry run: ./build-all.sh  (snapshot build into dist/, nothing published)
version: 2

builds:
  - id: nspeed
    binary: nspeed
    main: ./cmd/nspeed
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X nspeed.app/nspeed/nspeed.Version=v{{ .Version }}
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
    goarm:
      - "7"
    # other targets (mips routers, riscv64, ...): build from source, see README.md "Installation"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: "386"
      - goos: darwin
        goarch: "386"
      - goos: freebsd
        goarch: "386"
      - goos: freebsd
        goarch: arm

archives:
  - id: nspeed
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

nfpms:
  - id: nspeed
    package_name: nspeed
    homepage: https://nspeed.app
    maintainer: Jean-François Giorgi <jf@giorgi.email>
    description: Client and server high performance network bandwidth measurement tool (HTTP/1.1, HTTP/2, HTTP/3, QUIC, TCP, UDP)
    license: BSD-3-Clause
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: README.md
        dst: /usr/share/doc/nspeed/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/nspeed/CHANGELOG.md
      - src: LICENSE
        dst: /usr/share/doc/nspeed/LICENSE

# Homebrew tap (brew install nspeed-app/tap/nspeed): pushed to github.com/nspeed-app/homebrew-tap,
# only when the HOMEBREW_TAP_TOKEN secret is set (fine-grained PAT with contents:write on that repo).
homebrew_casks:
  - name: nspeed
    repository:
      owner: nspeed-app
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    homepage: https://nspeed.app
    description: Client and server high performance network bandwidth measurement tool
    license: BSD-3-Clause
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}auto{{ else }}true{{ end }}'
    # binaries are not notarized: drop the quarantine flag so macOS Gatekeeper doesn't block them
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/nspeed"]
          end

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  # tags like v1.2.3-rc1 are published as GitHub pre-releases
  prerelease: auto

# used only when CHANGELOG.md has no section for the tag (see .github/scripts/release-notes.sh)
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
