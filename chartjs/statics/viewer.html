<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>NSpeed Results</title>
    <style>
        .flex-container {
            display: flex;
            flex-flow: column;
            flex-direction: column;
            background-color: #bbdefb;
            height: 100%;
            padding: 15px;
            gap: 5px;

        }

        .flex-container>div {
            background: white;
            border: 3px solid #ffcc80;
            border-radius: 5px;
            padding: 8px;
        }
    </style>
    <script src="deps/chart.js"></script>
    <script src="deps/date-fns.js"></script>
    <script src="deps/chartjs-adapter-date-fns.js"></script>
    <script src="nspeed.js"></script>
    <script removeimports="true" src="genchart.js"></script>
</head>

<body>
    <h3>NSpeed 1.0.0</h3>
    <div id="dlgJSON" style="display:none;">
        <input type="file" id="file" style="display:none;" />
        <button type="button">
            <label for="file">open</label>
        </button>
    </div>
    <div class="flex-container">
        <div style="flex-grow:1; height:80vh;">
            <canvas id="chart"></canvas>
        </div>
        <div onclick="toggleCommand()">
            <hr style="height:2px;border:none;color:#333;background-color:#333;" />
            <pre id="#Command">	not loaded </pre>
            <hr style="height:2px;border:none;color:#333;background-color:#333;" />
        </div>
    </div>
    <script>

        function toggleCommand() {
            var x = document.getElementById("#Command");
            if (x.style.display === "none") {
                x.style.display = "block";
            } else {
                x.style.display = "none";
            }
        }
        let data = `{{.}}`;
        let jsonreport = null;
        function loadJSON(data, cmd) {
            try {
                jsonreport = JSON.parse(data); // Go template will replace this with actual json
            }
            catch (error) {
                cmd.textContent = error.name + ":" + error.message;
                return null
            }
            // for here, jsonreport is valid
            console.log(jsonreport);
            cmd.textContent = jsonreport.command;
            return genChart(/**@type {HTMLCanvasElement}*/document.getElementById("chart"), jsonreport);
        }
        window.onload = function () {
            var Command = document.getElementById('#Command');
            var dlgJSON = document.getElementById('dlgJSON')
            var chart = loadJSON(data, Command);
            if (jsonreport == null) {
                dlgJSON.style.display = "block";
                let input = document.getElementById('file');
                input.onchange = _ => {
                    let files = Array.from(input.files);
                    console.log(files[0]);
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        if (chart !== null) {
                            chart.destroy();
                        }
                        chart = loadJSON(e.target.result, Command);
                    };
                    reader.readAsText(files[0])
                };
                return; // todo display UI to load a json file
            }
        }

    </script>

</body>

</html>
