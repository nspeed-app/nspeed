<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>NSpeed Results</title>
    <style>
        .flex-container {
            display: flex;
            flex-flow: column;
            flex-direction: column;
            background-color: #bbdefb;
            height: 100%;
            padding: 15px;
            gap: 5px;

        }

        .flex-container>div {
            background: white;
            border: 3px solid #ffcc80;
            border-radius: 5px;
            padding: 8px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/date-fns/1.30.1/date_fns.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="nspeed.js"></script>
    <script removeimports="true" src="genchart.js"></script>
</head>

<body>
    <div class="flex-container">
        <div style="flex-grow:1; height:80vh;">
            <canvas id="chart"></canvas>
        </div>
        <div onclick="toggleCommand()">
            <hr style="height:2px;border:none;color:#333;background-color:#333;" />
            <pre id="#Command">	not loaded </pre>
            <hr style="height:2px;border:none;color:#333;background-color:#333;" />
        </div>
    </div>
    <script>

        function toggleCommand() {
            var x = document.getElementById("#Command");
            if (x.style.display === "none") {
                x.style.display = "block";
            } else {
                x.style.display = "none";
            }
        }
        window.onload = function () {
            var Command = document.getElementById('#Command');
            try {
                var jsonreport = JSON.parse(`{{.}}`); // Go template will replace this with actual json
            }
            catch (error) {
                Command.textContent = error.name + ":" + error.message;
            }
            if (jsonreport == null) {
                return; // todo display UI to load a json file
            }
            // for here, jsonreport is valid
            genChart(/**@type {HTMLCanvasElement}*/document.getElementById("chart"),jsonreport,Command);
        }
        
    </script>

</body>

</html>
